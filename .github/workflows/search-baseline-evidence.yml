name: Search Baseline Evidence

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Frozen commit to execute as the search baseline
        required: true
        default: 142a84ea290246f84f4ddc06d6362b8f4e3efba9
        type: string

jobs:
  baseline:
    name: Execute frozen search baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout evidence runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runner dependencies
        run: npm ci

      - name: Start disposable Supabase
        run: |
          npx supabase start
          npx supabase status -o env \
            --override-name db.url=DB107_ADMIN_DATABASE_URL \
            --override-name api.url=DB107_SUPABASE_URL \
            --override-name auth.anon_key=DB107_SUPABASE_ANON_KEY \
            | sed -nE 's/^(DB107_(ADMIN_DATABASE_URL|SUPABASE_URL|SUPABASE_ANON_KEY))="(.*)"$/\1=\3/p' \
            >> "$GITHUB_ENV"

      - name: Create and prepare frozen worktree
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          baseline_dir="$RUNNER_TEMP/netflux-search-baseline"
          git worktree add --detach "$baseline_dir" "$BASELINE_REF"
          mkdir -p "$baseline_dir/tests/baseline"
          cp tests/baseline/search-baseline-runtime.test.ts "$baseline_dir/tests/baseline/search-baseline-runtime.test.ts"
          cd "$baseline_dir"
          npm ci
          npx supabase db reset

      - name: Execute frozen baseline
        env:
          SEARCH_BASELINE_WORKTREE: "1"
          SEARCH_BASELINE_COMMIT: ${{ inputs.baseline_ref }}
          SEARCH_BASELINE_EVIDENCE_PATH: ${{ runner.temp }}/search-baseline-v1.json
        run: |
          cd "$RUNNER_TEMP/netflux-search-baseline"
          npx vitest run tests/baseline/search-baseline-runtime.test.ts

      - name: Retain baseline result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-baseline-v1-${{ inputs.baseline_ref }}
          path: ${{ runner.temp }}/search-baseline-v1.json
          if-no-files-found: error
