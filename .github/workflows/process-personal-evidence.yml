name: Process Personal Evidence Index

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-personal-evidence-index
  cancel-in-progress: false

jobs:
  process-personal-evidence-index:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process a bounded personal evidence batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent \
            --max-time 55 \
            "https://www.netflux.blog/api/admin/personal-evidence/process" \
            -H "Authorization: Bearer $CRON_SECRET"
