name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency posture
        run: npm run check:dependency-posture

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Unit)
        run: npm run test

      - name: Setup local Supabase
        run: npx supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          status_output="$(
            npx supabase status -o env \
              --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY
          )"
          exported_environment="$(
            printf '%s\n' "$status_output" \
              | sed -nE 's/^(NEXT_PUBLIC_SUPABASE_(URL|ANON_KEY))="(.*)"$/\1=\3/p'
          )"
          test "$(printf '%s\n' "$exported_environment" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$exported_environment" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_e2e
          NEXT_PUBLIC_POSTHOG_HOST: /flux
          NEXT_PUBLIC_POSTHOG_CAPTURE_BOT_EVENTS: "true"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test (E2E)
        run: npx playwright test
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_e2e
          NEXT_PUBLIC_POSTHOG_HOST: /flux
          NEXT_PUBLIC_POSTHOG_CAPTURE_BOT_EVENTS: "true"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
