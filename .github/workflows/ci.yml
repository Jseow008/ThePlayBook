name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Superseded PR verification can stop; main/manual runs retain unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      CATALOG_SEARCH_CURSOR_SECRET: ci-catalog-search-cursor-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLAYWRIGHT_SERVER_MODE: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Classify verification scope
        id: scope
        continue-on-error: true
        run: node scripts/classify-ci-changes.mjs

      - name: Validate route-shell policy
        run: node scripts/check-route-shell-policy.mjs

      - name: Install dependencies
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npm ci

      - name: Dependency posture
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npm run check:dependency-posture

      - name: Lint
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npm run lint

      - name: Typecheck
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npm run typecheck

      - name: Test (Unit)
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npm run test

      - name: Setup local Supabase
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npx supabase start

      - name: Export local Supabase environment
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        shell: bash
        run: |
          set -euo pipefail
          status_output="$(
            npx supabase status -o env \
              --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY
          )"
          exported_environment="$(
            printf '%s\n' "$status_output" \
              | sed -nE 's/^(NEXT_PUBLIC_SUPABASE_(URL|ANON_KEY))="(.*)"$/\1=\3/p'
          )"
          test "$(printf '%s\n' "$exported_environment" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$exported_environment" >> "$GITHUB_ENV"

      - name: Build
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_e2e
          NEXT_PUBLIC_POSTHOG_HOST: /flux
          NEXT_PUBLIC_POSTHOG_CAPTURE_BOT_EVENTS: "true"

      - name: Install Playwright Browsers
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npx playwright install --with-deps chromium

      - name: Test (E2E)
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false'
        run: npx playwright test
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_e2e
          NEXT_PUBLIC_POSTHOG_HOST: /flux
          NEXT_PUBLIC_POSTHOG_CAPTURE_BOT_EVENTS: "true"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always() && (steps.scope.outcome != 'success' || steps.scope.outputs.run_full != 'false')
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
