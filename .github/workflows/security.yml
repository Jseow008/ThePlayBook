name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL for full pre-production browser smoke verification
        required: false
        type: string
  schedule:
    - cron: "17 12 * * *"

jobs:
  security-gate:
    if: github.event_name != 'schedule'
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_KEY: dummy-service-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AI_PROVIDER: gemini
      AI_MODEL: gemini-pro
      GEMINI_API_KEY: dummy-gemini-key
      UPSTASH_REDIS_REST_URL: https://dummy-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy-redis-token
      NEXT_PUBLIC_SENTRY_DSN: https://dummy@sentry.io/123456
      HEALTH_CHECK_SECRET: dummy-health-secret
      ADMIN_ALLOWED_IPS: 127.0.0.1
      ANONYMOUS_ACTIVITY_SECRET: dummy-activity-secret
      ANTHROPIC_API_KEY: dummy-anthropic-key
      SUPABASE_LOCAL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run security:audit

      - name: Validate launch environment
        run: npm run validate:launch-env

      - name: Validate unique migration versions
        run: npm run check:migration-versions

      - name: Setup local Supabase
        run: |
          set -o pipefail

          run_with_transient_retry() {
            local log_file
            log_file="$(mktemp)"

            if "$@" 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              return 0
            fi

            if ! grep -Eqi 'Error status 50[234]:.*upstream server|invalid response.*upstream server' "$log_file"; then
              rm -f "$log_file"
              return 1
            fi

            echo "::warning::Supabase returned a transient upstream error; retrying once."
            rm -f "$log_file"
            "$@"
          }

          run_with_transient_retry npx supabase start
          run_with_transient_retry npx supabase db reset

      - name: Supabase SQL drift checks
        run: |
          npm run security:function-acls
          npm run security:admin-rpc-acls
          npm run security:embedding-table-reads
          npm run security:storage-bucket-listing
          npm run security:analytics-rls
          npm run database:gemini-vector-index
          npm run database:highlight-preservation
          npm run database:published-at

      - name: Security route and static tests
        run: npm run test:security

  production-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != ''
    name: Production Verification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ inputs.base_url }}
      NEXT_PUBLIC_APP_URL: ${{ inputs.base_url }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
      ADMIN_ALLOWED_IPS: ${{ secrets.ADMIN_ALLOWED_IPS }}
      ANONYMOUS_ACTIVITY_SECRET: ${{ secrets.ANONYMOUS_ACTIVITY_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_READ_PATH: ${{ vars.SMOKE_READ_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify production migration parity
        run: npm run check:migration-versions -- --remote

      - name: Run production verification checklist
        run: npm run verify:production -- --base-url "${{ inputs.base_url }}"

  supabase-advisor-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Supabase Advisor Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase security advisors
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: npm run security:supabase-advisors

      - name: Skip advisor audit without credentials
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: |
          echo "Skipping Supabase advisor audit because SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not configured."

  dependency-posture-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Dependency Posture Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency posture
        run: npm run check:dependency-posture

      - name: Report outdated dependencies
        run: npm run deps:outdated
